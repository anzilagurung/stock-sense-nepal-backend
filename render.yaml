# Render Blueprint — provisions the web service + free Postgres in one shot.
# Deploy with: Render Dashboard → New → Blueprint → select this repo.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: nepse-db
    plan: free

services:
  - type: web
    name: stock-sense-nepal
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      # Pin Python: Render's default (3.14) has no prebuilt wheels for pydantic-core
      # 2.27.2, which forces a Rust build that fails on the sandboxed build image.
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: nepse-db
          property: connectionString
